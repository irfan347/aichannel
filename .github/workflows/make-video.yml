name: Make video
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script file in scripts/"
        default: "scripts/video06.json"
      format:
        description: "both / landscape / vertical"
        default: "both"
      upload:
        description: "Upload to YouTube?"
        type: boolean
        default: false
      privacy:
        description: "private / unlisted / public"
        default: "private"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: sudo apt-get install -y fonts-inter || true
      - run: pip install edge-tts google-api-python-client google-auth-oauthlib pillow requests playwright && python -m playwright install --with-deps chromium
      - name: Render video, Short and thumbnail
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python main.py --from-script "${{ inputs.script }}" --format "${{ inputs.format }}"
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            scripts/*_out/final.mp4
            scripts/*_out/short.mp4
            scripts/*_out/thumbnail.png
      - name: Publish files for easy phone download (Releases page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(basename "${{ inputs.script }}" .json)
          OUT="scripts/${NAME}_out"
          mkdir -p dist
          [ -f "$OUT/final.mp4" ] && cp "$OUT/final.mp4" "dist/${NAME}-video.mp4"
          [ -f "$OUT/short.mp4" ] && cp "$OUT/short.mp4" "dist/${NAME}-short.mp4"
          [ -f "$OUT/thumbnail.png" ] && cp "$OUT/thumbnail.png" "dist/${NAME}-thumbnail.png"
          gh release create "${NAME}-run${{ github.run_number }}" dist/* \
            --title "${NAME} (run ${{ github.run_number }})" --notes "Tap a file to download it."
      - name: Upload to YouTube
        if: ${{ inputs.upload }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python main.py --from-script "${{ inputs.script }}" --upload-only --privacy "${{ inputs.privacy }}"
